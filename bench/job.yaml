apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench
  labels:
    app.kubernetes.io/name: vllm-bench
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-bench
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadtest
          image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
          command: ["python", "/bench/loadtest.py"]
          envFrom:
            - configMapRef:
                name: vllm-bench-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /bench
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: vllm-bench-script
