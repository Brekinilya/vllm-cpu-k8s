apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      serviceAccountName: vllm
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-cache
          image: model-downloader
          imagePullPolicy: IfNotPresent
          command: ["mkdir", "-p", "/models/.compile-cache"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
        - name: model-downloader
          image: model-downloader
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-model
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: downloader-tmp
              mountPath: /tmp
      containers:
        - name: vllm
          image: vllm-cpu
          imagePullPolicy: IfNotPresent
          args:
            - $(MODEL_DIR)
            - --config
            - /etc/vllm/serve.yaml
          envFrom:
            - configMapRef:
                name: vllm-model
            - configMapRef:
                name: vllm-runtime
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: API_KEY
            - name: XDG_CACHE_HOME
              value: /home/vllm/.cache
            - name: VLLM_CACHE_ROOT
              value: /home/vllm/.cache/vllm
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /home/vllm/.cache/torchinductor
            - name: TRITON_HOME
              value: /home/vllm/.cache
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "8"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: serve-config
              mountPath: /etc/vllm
              readOnly: true
            - name: models
              mountPath: /home/vllm/.cache
              subPath: .compile-cache
            - name: vllm-tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: serve-config
          configMap:
            name: vllm-serve
        - name: vllm-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: downloader-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
